# mise pins the runtimes and owns the task list.
#
# One canonical command runs everything: `mise run check`.
# Humans, agents, git hooks, and CI all use the same command. If they diverge,
# "it passes locally" starts meaning nothing.

[tools]
node = "22"
pnpm = "10"
# python = "3.12"   # uncomment when a project adds a Python service

[tasks.check]
description = "Everything. The one command humans, agents, hooks and CI all run."
depends = ["check:docs", "lint", "typecheck", "test"]

[tasks."check:docs"]
description = "The documentation gates. These fail the build."
run = "node tooling/checks/run-all.mjs"

[tasks.codemap]
description = "Regenerate CODEMAP.md from the workspace manifests."
run = "node tooling/checks/codemap-gen.mjs"

[tasks.lint]
description = "Lint changed packages."
run = "pnpm -r --if-present lint"

[tasks.format]
description = "Format the working tree."
run = "pnpm -r --if-present format"

[tasks.typecheck]
description = "Typecheck every workspace package."
run = "pnpm -r --if-present typecheck"

[tasks.test]
description = "Unit and integration tests."
run = "pnpm -r --if-present test"

[tasks."test:invariants"]
description = "Domain invariants only. These are append-only and never weakened."
run = "pnpm vitest run tests/invariants"

[tasks."test:e2e"]
description = "End-to-end suite. Needs a running environment."
run = "pnpm -r --if-present test:e2e"

[tasks.contracts]
description = "Regenerate everything derived from packages/contracts."
run = "pnpm --filter '@repo/contracts' --if-present generate"

# --- database -------------------------------------------------------------
# Agents call these, never the underlying tool directly. Wrapping them means the
# destructive modes are unreachable: there is no task that applies to production.

[tasks."db:diff"]
description = "Generate a migration from the declared schema. Pass a name."
run = "atlas migrate diff {{arg(name='name')}} --env local"

[tasks."db:lint"]
description = "Lint the newest migration for destructive or locking changes."
run = "atlas migrate lint --env local --latest 1"

[tasks."db:validate"]
description = "Verify no merged migration was edited or reordered."
run = "atlas migrate validate --env local"

[tasks."db:types"]
description = "Regenerate types from the schema. Commit the output."
run = "echo 'TODO: wire the generator for this project'"

[tasks."db:check"]
description = "Every database gate. Runs in CI."
depends = ["db:validate", "db:lint"]

# --- design ---------------------------------------------------------------

[tasks.tokens]
description = "Regenerate CSS, presets, and typed constants from the token source."
run = "pnpm --filter '@repo/tokens' --if-present generate"
